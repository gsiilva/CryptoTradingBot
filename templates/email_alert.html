<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333333;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .header {
            background-color: #16a34a;
            padding: 20px;
            color: #ffffff;
            text-align: center;
        }

        .content {
            padding: 20px;
        }

        .footer {
            background-color: #f1f5f9;
            padding: 20px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .info {
            color: #16a34a;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <h2>{{ titulo }}</h2>
        </div>

        <div class="content">
            <p>Olá, {{ nome }}!</p>

            <p>{{ mensagem }}</p>

            <p class="{{ status }}">
                {{ status_text }}
            </p>
        </div>

        <div class="footer">
            Este é um e-mail automático do CryptoTradingBot.
            <br>
            Por favor, não responda.
        </div>

    </div>
</body>
</html>
