<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef1f5;
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
        }

        table {
            border-collapse: collapse;
        }

        .wrapper {
            width: 100%;
            padding: 32px 16px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .header {
            background-color: #0f172a;
            padding: 28px 32px;
            text-align: center;
        }

        .header .brand {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.85;
            margin: 0 0 6px 0;
        }

        .header h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .content {
            padding: 32px;
        }

        .content p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 16px 0;
            color: #374151;
        }

        .greeting {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0 4px 0;
        }

        .status-badge.success {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-badge.error {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .status-badge.info {
            background-color: #dbeafe;
            color: #1d4ed8;
        }

        .divider {
            border-top: 1px solid #e5e7eb;
            margin: 24px 0;
        }

        .footer {
            background-color: #f9fafb;
            padding: 24px 32px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer p {
            font-size: 12px;
            line-height: 1.6;
            color: #9ca3af;
            margin: 0 0 4px 0;
        }

        .footer .company {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">

            <div class="header">
                <p class="brand">CryptoTradingBot</p>
                <h1>{{ titulo }}</h1>
            </div>

            <div class="content">
                <p class="greeting">Olá, {{ nome }}!</p>

                <p>{{ mensagem }}</p>

                <span class="status-badge {{ status }}">{{ status_text }}</span>

                <div class="divider"></div>

                <p style="font-size: 13px; color: #6b7280;">
                    Se você não reconhece esta atividade ou tiver dúvidas, entre em contato com o suporte antes de tomar qualquer ação.
                </p>
            </div>

            <div class="footer">
                <p class="company">CryptoTradingBot</p>
                <p>Este é um e-mail automático. Por favor, não responda.</p>
            </div>

        </div>
    </div>
</body>
</html>
